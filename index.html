<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E170C">
<title>Pudim Du Cariri — Gestão</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ds.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<div id="toast" role="status" aria-live="polite"></div>

<div id="modal" class="mb" hidden role="dialog" aria-modal="true" aria-labelledby="m-t">
  <div class="mx">
    <h3 id="m-t"></h3>
    <div id="m-b"></div>
    <div class="row"><button class="b" id="m-x" onclick="fechar()">Cancelar</button><button class="b pri" id="m-ok">Confirmar</button></div>
  </div>
</div>

<div id="login">
  <div class="lbox">
    <img src="assets/logo.png" alt="" class="llogo" onerror="this.replaceWith(document.createTextNode('🍮'))">
    <h1>Pudim Du Cariri</h1>
    <p>Controle interno</p>
    <input id="l-email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="l-senha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <button class="b pri" id="l-btn" onclick="entrar()">Entrar</button>
    <p id="lerr"></p>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><img src="assets/logo.png" alt="Pudim Du Cariri"></div>
    <nav id="nav" aria-label="Menu principal"></nav>
    <button id="colapsa" class="side-toggle" onclick="toggleSide()" aria-expanded="true" title="Recolher menu"><span class="ic" aria-hidden="true">«</span><span class="nt">Recolher menu</span></button>
    <div class="user"><small>Conectado como</small><span id="user"></span></div>
  </aside>
  <main id="conteudo" tabindex="-1">
    <header>
      <button class="b menu" aria-label="Abrir menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <img src="assets/logo.png" alt="" class="hlogo"><div class="hd"><small id="crumb"></small><h2 id="titulo"></h2></div>
      <div class="row">
        <span id="sync" class="sync">●</span>
        <button class="b adm" onclick="exportar()">Backup</button>
        <button class="b" onclick="sair()">Sair</button>
      </div>
    </header>
    <div id="tabs"></div>
  </main>
</div>

<nav id="bnav" aria-label="Navegação rápida">
<button data-t="dashboard" onclick="switchTab('dashboard')">📊<span>Painel</span></button>
<button data-t="estoque" onclick="switchTab('estoque')">🏭<span>Estoque</span></button>
<button data-t="vendas" onclick="switchTab('vendas')">🛒<span>Varejo</span></button>
<button data-t="atacado" onclick="switchTab('atacado')">📦<span>Atacado</span></button>
<button data-t="despesas" onclick="switchTab('despesas')">💸<span>Despesas</span></button>
<button onclick="document.getElementById('side').classList.toggle('open')">☰<span>Menu</span></button>
</nav>
<script src="js/app.js"></script>
</body>
</html>
