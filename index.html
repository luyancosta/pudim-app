<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pudim Du Cariri — Gestão</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="toast"></div>

<div id="modal" class="mb" hidden>
  <div class="mx">
    <h3 id="m-t"></h3>
    <div id="m-b"></div>
    <div class="row"><button class="b" onclick="fechar()">Cancelar</button><button class="b pri" id="m-ok">Confirmar</button></div>
  </div>
</div>

<div id="login">
  <div class="lbox">
    <img src="assets/logo.png" alt="" class="llogo" onerror="this.replaceWith(document.createTextNode('🍮'))">
    <h1>Pudim Du Cariri</h1>
    <p>Controle interno</p>
    <input id="l-email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="l-senha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <button class="b pri" id="l-btn" onclick="entrar()">Entrar</button>
    <p id="lerr"></p>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><img src="assets/logo.png" alt="" onerror="this.style.display='none'"><b>Pudim Du Cariri</b></div>
    <nav id="nav"></nav>
    <div class="user"><small>Conectado como</small><span id="user"></span></div>
  </aside>
  <main>
    <header>
      <button class="b menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="titulo"></h2>
      <div class="row">
        <span id="sync" class="sync">●</span>
        <button class="b adm" onclick="exportar()">Backup</button>
        <button class="b" onclick="sair()">Sair</button>
      </div>
    </header>
    <div id="tabs"></div>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
